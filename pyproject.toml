[project]
name = "urban-air-quality"
version = "0.1.0"
description = "Real-time urban air quality monitoring and forecasting"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
collectors = [
    "pymongo>=4.10,<5",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "kafka-python>=2.2,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collectors*", "streaming*", "database*"]
