name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        extras: ["none", "collectors"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # The pip cache folder only exists once something was installed.
          cache: ${{ matrix.extras == 'collectors' && 'pip' || '' }}
      # "none" proves the replay slice still runs with the standard library only.
      - name: Install collector dependencies
        if: matrix.extras == 'collectors'
        run: python -m pip install -e ".[collectors]"
      - name: Replay demo
        run: python -m streaming.replay --strict data/sample_measurements.jsonl > /dev/null
      - name: Unit tests
        run: python -m unittest discover -s tests -v
