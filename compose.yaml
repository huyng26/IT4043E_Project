name: urban-air-quality

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.1
    profiles: ["kafka", "collectors", "pipeline"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    profiles: ["kafka", "collectors", "pipeline"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic air_quality_raw --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic weather_raw --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic air_quality_latest --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic source_catalog --partitions 3 --replication-factor 1 --config retention.ms=604800000

  crawler:
    image: urban-air-quality-crawler:local
    build: .
    profiles: ["collectors", "pipeline"]
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_COLLECTOR_DATABASE: ${MONGO_COLLECTOR_DATABASE:-urban_air_quality_collector}
    volumes:
      - ./config/collectors.json:/app/config/collectors.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "from database import MongoDB; db=MongoDB(); assert db.ping(); db.close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  spark:
    image: urban-air-quality-spark:local
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["collectors", "pipeline"]
    restart: unless-stopped
    init: true
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-urban_air_quality}
      MONGO_COLLECTOR_DATABASE: ${MONGO_COLLECTOR_DATABASE:-urban_air_quality_collector}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STREAMING_CHECKPOINT_LOCATION: /checkpoints/mongo
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - spark_checkpoints:/checkpoints
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    stop_grace_period: 60s

volumes:
  mongodb_data:
  kafka_data:
  spark_checkpoints:
